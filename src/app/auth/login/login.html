<div style="min-height:100vh;background:var(--bg);display:flex;flex-direction:column;">
  <header style="padding:20px 32px;border-bottom:1px solid var(--border-soft);">
    <a routerLink="/" style="display:inline-flex;align-items:center;text-decoration:none;">
      <app-logo [width]="110" color="var(--cirvio-hunter)" />
    </a>
  </header>

  <main style="flex:1;display:flex;align-items:center;justify-content:center;padding:48px 24px;">
    <div class="animate-fade-up-1" style="width:100%;max-width:420px;">
      <div class="cirvio-glass" style="padding:40px 36px;">
        <div style="margin-bottom:28px;">
          <h1 style="font-size:26px;font-weight:600;letter-spacing:-0.015em;color:var(--fg-1);margin-bottom:8px;">Welcome back</h1>
          <p style="font-size:15px;color:var(--fg-2);">Log in to your Cirvio workspace.</p>
        </div>

        @if (sessionExpiredMsg()) {
          <div style="background:var(--warning-bg);border:1px solid var(--warning);border-radius:var(--radius-sm);padding:10px 14px;font-size:14px;color:var(--warning);margin-bottom:20px;">
            {{ sessionExpiredMsg() }}
          </div>
        }
        @if (error()) {
          <div style="background:var(--danger-bg);border:1px solid rgba(184,69,69,0.20);border-radius:var(--radius-sm);padding:10px 14px;font-size:14px;color:var(--danger);margin-bottom:20px;">
            {{ error() }}
          </div>
        }

        <!-- Social sign-in -->
        <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:24px;">
          @if (hasGoogle) {
            <div id="google-btn" style="display:flex;justify-content:center;min-height:44px;"></div>
          }

          <!-- Passkey -->
          <button (click)="signInWithPasskey()"
            style="width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:11px 16px;border:1px solid var(--border);border-radius:var(--radius-md);background:transparent;font-size:14px;font-weight:500;color:var(--fg-1);cursor:pointer;font-family:inherit;"
            onmouseenter="this.style.background='var(--neutral-50)'" onmouseleave="this.style.background='transparent'">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/>
            </svg>
            Sign in with Passkey
          </button>
        </div>

        <!-- Divider -->
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:24px;">
          <div style="flex:1;height:1px;background:var(--border-soft);"></div>
          <span style="font-size:12px;color:var(--fg-3);font-weight:500;">or continue with email</span>
          <div style="flex:1;height:1px;background:var(--border-soft);"></div>
        </div>

        <!-- Email/password form -->
        <form (submit)="handleSubmit($event)" style="display:flex;flex-direction:column;gap:16px;">
          <div>
            <label style="display:block;font-size:13px;font-weight:500;color:var(--fg-2);margin-bottom:6px;">
              Email <span style="color:var(--danger);">*</span>
            </label>
            <input name="email" type="email" placeholder="you@company.com"
              [value]="email()" (input)="email.set($any($event.target).value)"
              required autocomplete="email" class="field" />
          </div>

          <div>
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
              <label style="font-size:13px;font-weight:500;color:var(--fg-2);">Password <span style="color:var(--danger);">*</span></label>
              <a routerLink="/forgot-password" style="font-size:13px;color:var(--cirvio-sage);text-decoration:none;">Forgot password?</a>
            </div>
            <div style="position:relative;">
              <input name="password" [type]="showPassword() ? 'text' : 'password'" placeholder="Password"
                [value]="password()" (input)="password.set($any($event.target).value)"
                required autocomplete="current-password" class="field" style="padding-right:44px;" />
              <button type="button" (click)="showPassword.set(!showPassword())" tabindex="-1"
                style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--fg-3);padding:0;display:flex;">
                @if (showPassword()) {
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                } @else {
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                }
              </button>
            </div>
          </div>

          <button type="submit" class="btn-primary" [disabled]="!isFormReady || loading()" style="width:100%;padding:11px 22px;margin-top:4px;">
            {{ loading() ? 'Logging in…' : 'Log in' }}
          </button>
        </form>
      </div>

      <p style="text-align:center;margin-top:20px;font-size:14px;color:var(--fg-2);">
        Don't have an account?
        <a routerLink="/signup" style="color:var(--cirvio-sage);font-weight:500;text-decoration:none;">Sign up</a>
      </p>
      <p style="text-align:center;margin-top:12px;font-size:13px;color:var(--fg-3);">
        Admin? <a routerLink="/admin" style="color:var(--fg-2);text-decoration:none;">Admin portal →</a>
      </p>
    </div>
  </main>
</div>
