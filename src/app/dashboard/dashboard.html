<div class="dash-layout" style="display:flex;height:100vh;overflow:hidden;background:var(--bg);">

  <!-- Mobile top bar (hidden on desktop via styles.css) -->
  <header class="dash-topbar">
    <button class="dash-hamburger" (click)="mobileNavOpen.set(true)" aria-label="Open navigation">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
        <path d="M3 12h18M3 6h18M3 18h18" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
      </svg>
    </button>
    <app-logo [width]="96" color="var(--cirvio-hunter)" />
  </header>

  <!-- Backdrop (mobile only) -->
  @if (mobileNavOpen()) {
    <div class="dash-nav-backdrop" (click)="mobileNavOpen.set(false)"></div>
  }

  <app-sidenav [mobileOpen]="mobileNavOpen()" (navClose)="mobileNavOpen.set(false)" />

  <main class="dash-main" style="flex:1;overflow-y:auto;display:flex;flex-direction:column;">
    @if (banner(); as bn) {
      <div [style.background]="bn.level === 'danger' ? 'var(--danger-bg)' : 'var(--warning-bg)'"
        [style.color]="bn.level === 'danger' ? 'var(--danger)' : 'var(--warning)'"
        style="display:flex;align-items:center;justify-content:center;gap:12px;padding:10px 16px;font-size:13px;font-weight:500;flex-wrap:wrap;border-bottom:1px solid var(--border-soft);">
        <span>{{ bn.text }}</span>
        <a routerLink="/dashboard/settings"
          [style.background]="bn.level === 'danger' ? 'var(--danger)' : 'var(--warning)'"
          style="color:#fff;text-decoration:none;font-weight:600;padding:4px 14px;border-radius:var(--radius-pill);font-size:12px;">
          {{ bn.level === 'danger' ? 'Upgrade now' : 'View plans' }}
        </a>
      </div>
    }
    <router-outlet />
  </main>
</div>

<!-- Session expiry warning — rendered at root level, above everything -->
<app-session-warning />
