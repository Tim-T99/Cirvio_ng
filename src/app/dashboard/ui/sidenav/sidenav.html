<nav style="width:240px;flex-shrink:0;height:100vh;background:var(--bg-elev-1);border-right:1px solid var(--border-soft);display:flex;flex-direction:column;overflow:hidden;">

  <!-- Logo -->
  <div style="padding:24px 20px 20px;border-bottom:1px solid var(--border-soft);">
    <a routerLink="/dashboard" style="font-size:20px;font-weight:600;color:var(--cirvio-sage);text-decoration:none;letter-spacing:-0.02em;">Cirvio</a>
  </div>

  <!-- Nav links -->
  <div style="flex:1;padding:12px 10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto;">
    @for (link of navLinks; track link.path) {
      <a [routerLink]="link.path" [routerLinkActive]="'nav-active'"
         [routerLinkActiveOptions]="{ exact: link.exact }"
         style="display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--radius-sm);font-size:14px;font-weight:500;color:var(--fg-2);text-decoration:none;transition:background var(--dur-fast) var(--ease-out),color var(--dur-fast) var(--ease-out);">

        @if (link.icon === 'chat') {
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
        }
        @if (link.icon === 'docs') {
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
            <polyline points="10 9 9 9 8 9"/>
          </svg>
        }
        @if (link.icon === 'settings') {
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        }

        {{ link.label }}
      </a>
    }
  </div>

  <!-- User footer -->
  <div style="padding:14px 16px;border-top:1px solid var(--border-soft);">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
      <div style="width:32px;height:32px;border-radius:50%;background:var(--cirvio-mint-50);border:1px solid var(--cirvio-mint-300);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--cirvio-hunter);flex-shrink:0;">
        {{ initials }}
      </div>
      <div style="flex:1;min-width:0;">
        <p style="font-size:13px;font-weight:500;color:var(--fg-1);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{ displayName }}</p>
      </div>
    </div>
    <button (click)="logout()" style="width:100%;display:flex;align-items:center;gap:8px;padding:7px 10px;background:none;border:1px solid var(--border-soft);border-radius:var(--radius-sm);cursor:pointer;color:var(--fg-3);font-size:13px;transition:all var(--dur-fast) var(--ease-out);"
      onmouseenter="this.style.borderColor='var(--border)';this.style.color='var(--fg-1)'"
      onmouseleave="this.style.borderColor='var(--border-soft)';this.style.color='var(--fg-3)'">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      Log out
    </button>
  </div>

</nav>

<style>
.nav-active {
  background: var(--cirvio-mint-50) !important;
  color: var(--cirvio-hunter) !important;
  border: 1px solid var(--cirvio-mint-100);
}
</style>
