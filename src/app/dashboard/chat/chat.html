<div class="flex flex-col h-full gap-4 p-4">
  <div class="relative">
    <input
      type="text"
      placeholder="Message"
      [(ngModel)]="message"
      (keydown.enter)="sendMessage()"
      class="w-full pl-5 pr-12 py-4 rounded-xl border border-gray-300 focus:outline-none focus:border-blue-500 bg-transparent text-foreground"
    />
    <button
      (click)="sendMessage()"
      class="absolute right-3 top-1/2 -translate-y-1/2 text-foreground/60 hover:text-foreground transition-colors"
      aria-label="Send"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>

  <div class="flex flex-wrap">
    <label class="btn-upload">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="17 8 12 3 7 8"></polyline>
        <line x1="12" y1="3" x2="12" y2="15"></line>
      </svg>
      Upload Document
      <input type="file" class="hidden" accept="text/plain,application/pdf,application/msword,application/zip,application/json" />
    </label>

    <label class="upload-file">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
        <circle cx="8.5" cy="8.5" r="1.5"></circle>
        <polyline points="21 15 16 10 5 21"></polyline>
      </svg>
      Upload Image
      <input type="file" class="hidden" accept=".png,.jpg,.jpeg,.webp" />
    </label>
  </div>
</div>
