<header style="
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(248,248,246,0.92);
  backdrop-filter: blur(16px) saturate(160%);
  -webkit-backdrop-filter: blur(16px) saturate(160%);
  border-bottom: 1px solid var(--border-soft);
  box-shadow: var(--shadow-xs);
">
  <div style="
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 32px;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
  ">
    <!-- Logo -->
    <a routerLink="/" style="display: inline-block; line-height: 0; flex-shrink: 0;">
      <app-logo [width]="110" color="var(--cirvio-hunter)" />
    </a>

    <!-- Desktop nav -->
    <nav class="desktop-only" style="display: flex; align-items: center; gap: 4px;">
      <a
        routerLink="/features"
        routerLinkActive="nav-active"
        style="font-size: 14px; font-weight: 500; color: var(--fg-2); text-decoration: none; padding: 6px 14px; border-radius: var(--radius-sm); transition: color var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out);"
        onmouseenter="this.style.color='var(--fg-1)'; this.style.background='var(--border-soft)'"
        onmouseleave="if(!this.classList.contains('nav-active')){this.style.color='var(--fg-2)'; this.style.background='transparent'}"
      >Features</a>
      <a
        routerLink="/pricing"
        routerLinkActive="nav-active"
        style="font-size: 14px; font-weight: 500; color: var(--fg-2); text-decoration: none; padding: 6px 14px; border-radius: var(--radius-sm); transition: color var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out);"
        onmouseenter="this.style.color='var(--fg-1)'; this.style.background='var(--border-soft)'"
        onmouseleave="if(!this.classList.contains('nav-active')){this.style.color='var(--fg-2)'; this.style.background='transparent'}"
      >Pricing</a>
      <a
        routerLink="/about"
        routerLinkActive="nav-active"
        style="font-size: 14px; font-weight: 500; color: var(--fg-2); text-decoration: none; padding: 6px 14px; border-radius: var(--radius-sm); transition: color var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out);"
        onmouseenter="this.style.color='var(--fg-1)'; this.style.background='var(--border-soft)'"
        onmouseleave="if(!this.classList.contains('nav-active')){this.style.color='var(--fg-2)'; this.style.background='transparent'}"
      >About</a>
      <a
        routerLink="/contact"
        routerLinkActive="nav-active"
        style="font-size: 14px; font-weight: 500; color: var(--fg-2); text-decoration: none; padding: 6px 14px; border-radius: var(--radius-sm); transition: color var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out);"
        onmouseenter="this.style.color='var(--fg-1)'; this.style.background='var(--border-soft)'"
        onmouseleave="if(!this.classList.contains('nav-active')){this.style.color='var(--fg-2)'; this.style.background='transparent'}"
      >Contact</a>
    </nav>

    <!-- Desktop CTAs -->
    <div class="desktop-only" style="display: flex; align-items: center; gap: 10px; flex-shrink: 0;">
      <a routerLink="/login" class="btn-ghost" style="padding: 8px 18px; font-size: 14px;">Log in</a>
      <a routerLink="/signup" class="btn-primary" style="padding: 8px 18px; font-size: 14px;">Get started</a>
    </div>

    <!-- Mobile hamburger -->
    <button
      class="mobile-only"
      (click)="toggleMenu()"
      aria-label="Toggle menu"
      style="
        display: none;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        background: transparent;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        cursor: pointer;
        color: var(--fg-1);
        flex-shrink: 0;
      "
    >
      @if (open()) {
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <path d="M2 2L16 16M16 2L2 16" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
        </svg>
      } @else {
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <path d="M2 5h14M2 9h14M2 13h14" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
        </svg>
      }
    </button>
  </div>

  <!-- Mobile dropdown -->
  @if (open()) {
    <div style="
      border-top: 1px solid var(--border-soft);
      background: rgba(248,248,246,0.98);
      padding: 16px 24px 24px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    ">
      <a routerLink="/features" (click)="closeMenu()" style="font-size: 15px; font-weight: 500; color: var(--fg-1); text-decoration: none; padding: 10px 12px; border-radius: var(--radius-sm);">Features</a>
      <a routerLink="/pricing"  (click)="closeMenu()" style="font-size: 15px; font-weight: 500; color: var(--fg-1); text-decoration: none; padding: 10px 12px; border-radius: var(--radius-sm);">Pricing</a>
      <a routerLink="/about"    (click)="closeMenu()" style="font-size: 15px; font-weight: 500; color: var(--fg-1); text-decoration: none; padding: 10px 12px; border-radius: var(--radius-sm);">About</a>
      <a routerLink="/contact"  (click)="closeMenu()" style="font-size: 15px; font-weight: 500; color: var(--fg-1); text-decoration: none; padding: 10px 12px; border-radius: var(--radius-sm);">Contact</a>
      <div style="border-top: 1px solid var(--border-soft); margin: 12px 0; padding-top: 16px; display: flex; flex-direction: column; gap: 10px;">
        <a routerLink="/login"  (click)="closeMenu()" class="btn-ghost" style="width: 100%; justify-content: center;">Log in</a>
        <a routerLink="/signup" (click)="closeMenu()" class="btn-primary" style="width: 100%; justify-content: center;">Get started</a>
      </div>
    </div>
  }
</header>

<style>
  a.nav-active {
    color: var(--cirvio-hunter) !important;
    background: rgba(23, 66, 43, 0.06) !important;
  }
  .mobile-only { display: none !important; }
  @media (max-width: 768px) {
    .desktop-only { display: none !important; }
    .mobile-only  { display: flex !important; }
  }
</style>
