<div class="flex h-[95%] flex-col px-3 py-4 md:px-2 bg-emerald-800/10 border border-hunterGreen m-5 rounded-md">
  <a
    class="mb-2 flex h-20 items-end justify-start rounded-md p-4 md:h-40"
    routerLink="/"
  >
    <div class="w-32 text-white md:w-40">
      <p>Logo</p>
    </div>
  </a>

  <div class="flex grow flex-row justify-between space-x-2 md:flex-col md:space-x-0 md:space-y-2">
    <app-nav-links />

    <div class="hidden h-auto w-full grow rounded-md md:block"></div>

    <button
      (click)="auth.logout()"
      class="flex h-12 w-full grow items-center justify-center gap-2 rounded-md p-3 text-sm font-medium hover:bg-sky-100 hover:text-blue-600 md:flex-none md:justify-start md:p-2 md:px-3"
    >
      <div class="hidden md:block">Sign Out</div>
    </button>
  </div>
</div>
